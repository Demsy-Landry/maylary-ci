<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` laisse la page peindre sous la barre d'état et sous
         la barre d'accueil : c'est ce qui permet à la photographie d'ouverture
         de monter jusqu'en haut de l'écran. En contrepartie, tout ce qui se
         pose au bord doit s'écarter des zones de sécurité — voir les classes
         `pt-[env(safe-area-inset-top)]` sur les en-têtes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MayLary Group — Transit, import et export en Côte d'Ivoire</title>
    <meta
      name="description"
      content="MayLary Group accompagne entreprises et particuliers pour importer et exporter leurs marchandises depuis Abidjan : transit, dédouanement, fret aérien et maritime, assurance facultés."
    />
    <!-- PAS de balise `canonical` ici, et c'est délibéré.
         L'hébergeur renvoie ce même fichier pour les cent soixante-huit
         adresses du site. Une canonique écrite en dur pointait donc l'accueil
         depuis CHAQUE fiche produit et chaque rayon — c'est-à-dire qu'elle
         demandait à Google de n'en indexer aucune. Nous soumettions un sitemap
         de cent soixante-huit adresses et nous les désavouions une par une.
         Sans balise, un moteur retient l'adresse qu'il a visitée : c'est
         exactement ce qu'il faut. `useReferencement` pose ensuite la canonique
         exacte de la page, une fois le rendu fait. -->

    <!-- `og:url` reste, lui, à l'accueil : les robots d'aperçu de WhatsApp et
         de Facebook n'exécutent pas le JavaScript et ne liront jamais autre
         chose que ce fichier. Une adresse de marque vaut mieux qu'aucune. -->


    <!-- Icônes. Toutes tirées du logo de la maison : le dessin étant une
         illustration et non un tracé vectoriel, le favicon est un PNG plutôt
         qu'un SVG — un vectoriel reconstitué à la main s'écarterait du logo. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#f2a618" />
    <meta name="apple-mobile-web-app-title" content="MayLary" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Partage. Sans image déclarée, un lien collé dans WhatsApp — le canal
         par lequel arrive la moitié du trafic ici — s'affiche en texte nu.
         L'adresse doit être absolue : les aperçus sont fabriqués par un
         serveur distant qui ne sait pas d'où vient le chemin relatif. -->
    <meta property="og:site_name" content="MayLary Group" />
    <meta property="og:title" content="MayLary Group — Transit, import et export en Côte d'Ivoire" />
    <meta
      property="og:description"
      content="Transit, dédouanement, fret aérien et maritime, assurance facultés. Devis clair et suivi de dossier en ligne."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CI" />
    <meta property="og:url" content="https://maylarygroup.ci/" />
    <meta property="og:image" content="https://maylarygroup.ci/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MayLary Group — import, export, sourcing, transit" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MayLary Group — Transit, import et export en Côte d'Ivoire" />
    <meta
      name="twitter:description"
      content="Transit, dédouanement, fret aérien et maritime. Devis clair et suivi de dossier en ligne."
    />
    <meta name="twitter:image" content="https://maylarygroup.ci/og-image.png" />

    <!-- Ce que le moteur affiche à droite des résultats. Il décrit ce que la
         maison fait réellement : commission de transport et vente en ligne. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MayLary Group",
        "legalName": "Dems'Inc",
        "url": "https://maylarygroup.ci/",
        "logo": "https://maylarygroup.ci/icone-512.png",
        "image": "https://maylarygroup.ci/og-image.png",
        "description": "Transit, import, export, sourcing et vente en ligne depuis Abidjan.",
        "email": "yaolandry67@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Abidjan",
          "addressCountry": "CI"
        },
        "areaServed": { "@type": "Country", "name": "Côte d'Ivoire" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Ce qu'un visiteur voit si le JavaScript ne s'exécute pas : réseau
         coupé en cours de chargement, navigateur ancien, script bloqué. Sans
         ce bloc, il regarde une page blanche sans savoir quoi faire. -->
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 34rem; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6">
        <h1 style="font-size: 1.4rem">MayLary Group</h1>
        <p>
          Ce site a besoin de JavaScript pour fonctionner. Activez-le dans les réglages de votre
          navigateur, puis rechargez la page.
        </p>
        <p>
          Vous pouvez aussi nous écrire directement à
          <a href="mailto:yaolandry67@gmail.com">yaolandry67@gmail.com</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
