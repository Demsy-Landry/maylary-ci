<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MayLary Group">
  <!--
    L'icône de marque : la pile de colis, en orange MayLary.

    Elle reprend trait pour trait le logo dessiné sur les factures et les
    bulletins (`dessinerLogo` dans facture-pdf.ts) — mêmes proportions, même
    orange. Un site dont l'onglet ne ressemble pas à ses factures a l'air
    d'être deux entreprises.

    L'icône précédente était violette : un reste de l'outil d'échafaudage,
    sans rapport avec la marque.
  -->
  <rect width="512" height="512" rx="113" fill="#F2A618"/>
  <g fill="#FFFFFF">
    <rect x="174" y="82"  width="164" height="164" rx="20"/>
    <rect x="67"  y="266" width="164" height="164" rx="20"/>
    <rect x="282" y="266" width="164" height="164" rx="20"/>
  </g>
</svg>
